# 放在 DEPLOY_DIR（默认 /home/DockerCompose/gpt-load）。
# 本目录 .env 仅保存 REGISTRY_REPO / VERSION；应用配置和数据放在下方独立目录。
services:
  gpt-load:
    image: ${REGISTRY_REPO:?REGISTRY_REPO is required}:${VERSION:?VERSION is required}
    container_name: gpt-load
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3001:3001"
    env_file:
      - /home/DockerVolumes/gpt-load/.env
    volumes:
      - /home/DockerVolumes/gpt-load/data:/app/data
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 10 -O /dev/null http://localhost:$${PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
